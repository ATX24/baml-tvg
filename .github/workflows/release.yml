name: BAML Swift Release

on:
  workflow_dispatch: {}
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version_string: ${{ steps.set-version.outputs.version }}
      is_release_tag: ${{ steps.set-version.outputs.is_release_tag }}
    steps:
      - name: Set Version Info
        id: set-version
        run: |
          VERSION="0.0.0-dev"
          IS_RELEASE="false"
          REF_NAME="${{ github.ref_name }}"
          REF_TYPE="${{ github.ref_type }}"

          if [[ "$REF_TYPE" == "tag" ]] && [[ "$REF_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            IS_RELEASE="true"
            VERSION="$REF_NAME"
          fi

          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "is_release_tag=$IS_RELEASE" >> $GITHUB_OUTPUT
          echo "Determined version: $VERSION, is_release_tag: $IS_RELEASE"

  build-swift-xcframework:
    uses: ./.github/workflows/build-swift-release.reusable.yaml
    secrets: inherit

  publish-to-github:
    environment: release
    permissions:
      contents: write
    needs: [build-swift-xcframework, determine-version]
    if: ${{ needs.determine-version.outputs.is_release_tag == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download XCFramework artifact
        uses: actions/download-artifact@v4
        with:
          name: BamlCFFI-xcframework
          path: xcframework-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ needs.determine-version.outputs.version_string }}
          tag_name: ${{ needs.determine-version.outputs.version_string }}
          draft: false
          prerelease: false
          files: |
            xcframework-artifacts/BamlCFFI.xcframework.zip
            xcframework-artifacts/BamlCFFI.xcframework.zip.sha256
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}
          generate_release_notes: false

  push-to-swift-prototype:
    name: Push to baml-swift-prototype (SPM distribution)
    needs: [publish-to-github, determine-version]
    if: ${{ needs.determine-version.outputs.is_release_tag == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history required for git subtree split

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Download XCFramework artifact
        uses: actions/download-artifact@v4
        with:
          name: BamlCFFI-xcframework
          path: xcframework-artifacts

      - name: Split subtree into dist branch
        run: |
          git subtree split \
            --prefix engine/language_client_swift \
            -b swift-dist-branch

      - name: Stamp Package.swift on dist branch
        run: |
          VERSION="${{ needs.determine-version.outputs.version_string }}"
          SPM_CHECKSUM=$(cat xcframework-artifacts/BamlCFFI.xcframework.zip.spm_checksum)

          git worktree add /tmp/swift-dist swift-dist-branch

          sed \
            -e "s/BAML_VERSION/${VERSION}/g" \
            -e "s/BAML_SPM_CHECKSUM/${SPM_CHECKSUM}/g" \
            /tmp/swift-dist/Package.distribution.swift > /tmp/swift-dist/Package.swift

          cd /tmp/swift-dist
          git add Package.swift
          git commit -m "chore: stamp Package.swift for release ${VERSION}"

      - name: Push to baml-swift-prototype
        env:
          BAML_SWIFT_PUSH_TOKEN: ${{ secrets.BAML_SWIFT_PUSH_TOKEN }}
        run: |
          VERSION="${{ needs.determine-version.outputs.version_string }}"
          REMOTE="https://x-access-token:${BAML_SWIFT_PUSH_TOKEN}@github.com/atx24/baml-swift-prototype.git"

          # actions/checkout stores GITHUB_TOKEN in the LOCAL repo config (.git/config).
          # Unset it so our PAT (embedded in the remote URL) is used instead.
          git config --local --unset-all "http.https://github.com/.extraheader" || true

          cd /tmp/swift-dist
          git push "$REMOTE" HEAD:main --force-with-lease
          git tag "$VERSION"
          git push "$REMOTE" "$VERSION"
