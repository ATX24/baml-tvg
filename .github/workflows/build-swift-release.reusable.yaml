name: BAML Release - Build Swift XCFramework

on:
  workflow_call: {}
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-build-swift
  cancel-in-progress: true

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Build XCFramework (all slices: ios, ios-sim, macos)
  # -----------------------------------------------------------------------
  build-xcframework:
    name: Build XCFramework
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Compute XCFramework cache key
        id: cache-key
        run: |
          HASH=$(find engine/language_client_cffi engine/baml-runtime engine/language_client_swift/include \
            -type f | sort | xargs shasum -a 256 | shasum -a 256 | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Restore XCFramework cache
        id: xcframework-cache
        uses: actions/cache@v4
        with:
          path: |
            engine/language_client_swift/BamlCFFI.xcframework.zip
            engine/language_client_swift/BamlCFFI.xcframework.zip.sha256
            engine/language_client_swift/BamlCFFI.xcframework.zip.spm_checksum
          key: xcframework-${{ runner.os }}-${{ steps.cache-key.outputs.hash }}

      - name: Install Rust targets
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        run: |
          rustup target add aarch64-apple-ios
          rustup target add x86_64-apple-ios
          rustup target add aarch64-apple-ios-sim
          rustup target add aarch64-apple-darwin
          rustup target add x86_64-apple-darwin

      - name: Cache Rust build
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build XCFramework
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-xcframework.sh
        working-directory: engine/language_client_swift

      - name: Compute SHA256 and SPM checksum
        if: steps.xcframework-cache.outputs.cache-hit != 'true'
        id: checksum
        run: |
          SHA=$(shasum -a 256 BamlCFFI.xcframework.zip | awk '{print $1}')
          echo "$SHA" > BamlCFFI.xcframework.zip.sha256
          SPM=$(swift package compute-checksum BamlCFFI.xcframework.zip)
          echo "$SPM" > BamlCFFI.xcframework.zip.spm_checksum
          echo "sha256=$SHA" >> $GITHUB_OUTPUT
          echo "spm_checksum=$SPM" >> $GITHUB_OUTPUT
        working-directory: engine/language_client_swift

      - name: Upload XCFramework artifact
        uses: actions/upload-artifact@v4
        with:
          name: BamlCFFI-xcframework
          path: |
            engine/language_client_swift/BamlCFFI.xcframework.zip
            engine/language_client_swift/BamlCFFI.xcframework.zip.sha256
            engine/language_client_swift/BamlCFFI.xcframework.zip.spm_checksum
          retention-days: 7

  # -----------------------------------------------------------------------
  # Job 2: macOS integration tests (dylib / dlopen path)
  # -----------------------------------------------------------------------
  test-macos:
    name: Integration Tests (macOS / dlopen)
    needs: build-xcframework
    runs-on: macos-14
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute dylib cache key
        id: dylib-cache-key
        run: |
          HASH=$(find engine/language_client_cffi engine/baml-runtime engine/Cargo.lock \
            -type f | sort | xargs shasum -a 256 | shasum -a 256 | awk '{print $1}')
          echo "hash=$HASH" >> $GITHUB_OUTPUT

      - name: Restore dylib cache
        id: dylib-cache
        uses: actions/cache@v4
        with:
          path: engine/target/aarch64-apple-darwin/release/libbaml_cffi.dylib
          key: dylib-macos-${{ steps.dylib-cache-key.outputs.hash }}

      - name: Cache Rust build
        if: steps.dylib-cache.outputs.cache-hit != 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine

      - name: Build macOS dylib
        if: steps.dylib-cache.outputs.cache-hit != 'true'
        run: |
          cargo build --release -p baml_cffi --target aarch64-apple-darwin
        working-directory: engine

      - name: Resolve Swift package
        run: swift package resolve
        working-directory: integ-tests/swift

      - name: Run macOS integration tests
        run: |
          BAML_LIBRARY_PATH="${{ github.workspace }}/engine/target/aarch64-apple-darwin/release/libbaml_cffi.dylib" \
          swift test
        working-directory: integ-tests/swift

  # -----------------------------------------------------------------------
  # Job 3: iOS simulator integration tests (XCFramework / static path)
  # -----------------------------------------------------------------------
  test-ios-simulator:
    name: Integration Tests (iOS Simulator / static)
    needs: build-xcframework
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Download XCFramework artifact
        uses: actions/download-artifact@v4
        with:
          name: BamlCFFI-xcframework
          path: engine/language_client_swift

      - name: Unzip XCFramework
        run: unzip -o BamlCFFI.xcframework.zip
        working-directory: engine/language_client_swift

      - name: Resolve XCFramework symlink
        # Replace the symlink with the real directory so xcodebuild can resolve
        # the binaryTarget. We know exactly where the unzipped framework lives.
        run: |
          rm integ-tests/swift-ios/BamlCFFI.xcframework
          cp -r engine/language_client_swift/BamlCFFI.xcframework \
                integ-tests/swift-ios/BamlCFFI.xcframework

      - name: Run iOS simulator integration tests
        run: |
          xcodebuild test \
            -scheme BamlIOSIntegTests-Package \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest'
        working-directory: integ-tests/swift-ios
